  </style>
  <rect width="320" height="366" fill="#ffffff"/>
  <text x="12" y="18" font-size="13" font-weight="bold">Diagram legend (greyscale)</text>
  <g transform="translate(0, 30)"><g class="viz-legend" role="group" aria-label="Diagram legend" data-viz-legend="" data-legend-width="320" data-legend-height="336"><title>Diagram legend</title><defs><marker id="legend-open-arrow" markerWidth="8" markerHeight="8" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth"><path class="viz-arrow viz-arrow--open" d="M0,0 L8,3 L0,6" fill="none" stroke="var(--viz-edge)" stroke-width="1.25"/></marker><marker id="legend-filled-arrow" markerWidth="8" markerHeight="8" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth"><path class="viz-arrow viz-arrow--filled" d="M0,0 L8,3 L0,6 Z" fill="var(--viz-edge)"/></marker></defs><rect class="viz-shape viz-shape--rounded-rect" data-node-shape="rounded-rect" fill="var(--viz-node)" stroke="var(--viz-edge)" x="12" y="17" width="22" height="14" rx="6" ry="6"/><text class="viz-legend-label" data-node-kind="function" data-node-prefix="fn" x="44" y="24" dominant-baseline="middle">fn — function</text><rect class="viz-shape viz-shape--rect" data-node-shape="rect" fill="var(--viz-node)" stroke="var(--viz-edge)" x="12" y="43" width="22" height="14" rx="0" ry="0"/><text class="viz-legend-label" data-node-kind="struct" data-node-prefix="struct" x="44" y="50" dominant-baseline="middle">struct — struct</text><path class="viz-shape viz-shape--notched" data-node-shape="notched-rect" fill="var(--viz-node)" stroke="var(--viz-edge)" d="M 12 69 H 29.333333333333332 L 34 73.66666666666667 V 83 H 12 Z"/><text class="viz-legend-label" data-node-kind="union" data-node-prefix="union" x="44" y="76" dominant-baseline="middle">union — union</text><rect class="viz-shape viz-shape--rect" data-node-shape="rect" fill="var(--viz-node)" stroke="var(--viz-edge)" x="12" y="95" width="22" height="14" rx="0" ry="0"/><text class="viz-legend-label" data-node-kind="enum" data-node-prefix="enum" x="44" y="102" dominant-baseline="middle">enum — enum</text><rect class="viz-shape viz-shape--dashed-outline-rect" data-node-shape="dashed-outline-rect" fill="none" stroke="var(--viz-edge)" x="12" y="121" width="22" height="14" rx="0" ry="0" stroke-dasharray="5 3"/><text class="viz-legend-label" data-node-kind="stub" data-node-prefix="stub" x="44" y="128" dominant-baseline="middle">stub — stub (links to docs)</text><line class="viz-edge-swatch" data-edge-kind="arg" data-edge-dash="solid" data-edge-marker="filled-arrow" x1="12" y1="154" x2="34" y2="154" stroke="var(--viz-edge)" stroke-width="1.75" marker-end="url(#legend-filled-arrow)"/><text class="viz-legend-label" data-edge-label="arg" x="44" y="154" dominant-baseline="middle">argument (solid, filled arrow)</text><line class="viz-edge-swatch" data-edge-kind="return" data-edge-dash="solid" data-edge-marker="open-arrow" x1="12" y1="180" x2="34" y2="180" stroke="var(--viz-edge)" stroke-width="1.75" marker-end="url(#legend-open-arrow)"/><text class="viz-legend-label" data-edge-label="return" x="44" y="180" dominant-baseline="middle">return (solid, open arrow)</text><line class="viz-edge-swatch" data-edge-kind="field" data-edge-dash="solid" data-edge-marker="none" x1="12" y1="206" x2="34" y2="206" stroke="var(--viz-edge)" stroke-width="1"/><text class="viz-legend-label" data-edge-label="field" x="44" y="206" dominant-baseline="middle">field (thin solid)</text><line class="viz-edge-swatch" data-edge-kind="observed" data-edge-dash="dashed" data-edge-marker="open-arrow" x1="12" y1="232" x2="34" y2="232" stroke="var(--viz-observed)" stroke-width="1.75" stroke-dasharray="5 3" marker-end="url(#legend-open-arrow)"/><text class="viz-legend-label" data-edge-label="observed" x="44" y="232" dominant-baseline="middle">observed (dashed, labelled)</text><rect class="viz-mark-square" data-write-square="filled" x="12" y="251" width="14" height="14" fill="var(--viz-write)" stroke="var(--viz-write)" stroke-width="1.5"/><text class="viz-mark-glyph" data-write-mark="write" data-write-square="filled" data-write-glyph="W" x="19" y="258" text-anchor="middle" dominant-baseline="middle" fill="var(--viz-ground)">W</text><text class="viz-legend-label" data-write-label="write" x="44" y="258" dominant-baseline="middle">observed write</text><rect class="viz-mark-square" data-write-square="outline" x="12" y="277" width="14" height="14" fill="none" stroke="var(--viz-read)" stroke-width="1.5"/><text class="viz-mark-glyph" data-write-mark="read" data-write-square="outline" data-write-glyph="R" x="19" y="284" text-anchor="middle" dominant-baseline="middle" fill="var(--viz-read)">R</text><text class="viz-legend-label" data-write-label="read" x="44" y="284" dominant-baseline="middle">no writes seen</text><text class="viz-mark-glyph" data-write-mark="unknown" data-write-square="none" data-write-glyph="?" x="19" y="310" text-anchor="middle" dominant-baseline="middle" fill="currentColor">?</text><text class="viz-legend-label" data-write-label="unknown" x="44" y="310" dominant-baseline="middle">unknown</text></g></g>
